name: Laravel Dusk

on:
  push:
    branches: [ 2.0 ]
  pull_request:
    branches: [ 2.0 ]
  workflow_dispatch:

jobs:
  dusk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '5.*',  php: '7.2' }
          - { laravel: '6.*',  php: '7.3' }
          - { laravel: '7.*',  php: '7.3' }
          - { laravel: '8.*',  php: '8.0' }
          - { laravel: '9.*',  php: '8.0' }
          - { laravel: '10.*', php: '8.1' }
          - { laravel: '11.*', php: '8.2' }
          - { laravel: '12.*', php: '8.3' }
          - { laravel: '13.*', php: '8.3' }

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - uses: actions/checkout@v4

      - name: Allow EOL dependencies
        # Composer 2.9+ 默认拦截有安全公告的包，EOL 的 Laravel 5~11 及其依赖需要放行
        run: composer config --global policy.advisories.block false

      - name: Install Dependencies
        run: |
          composer create-project --prefer-dist laravel/laravel laravel-tests "${{ matrix.laravel }}"
          sh ./tests/bin/install-dep.sh

      - name: Install Admin
        run: sh ./tests/bin/install-admin.sh

      - name: Start Server
        run: sh ./tests/bin/start.sh

      - name: Run test suite
        run: cd ./laravel-tests && php artisan dusk
